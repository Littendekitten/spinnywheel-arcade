<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arcade Phone Controller</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --green: #22c55e;
      --red: #ef4444;
      --card: rgba(15, 23, 42, 0.82);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.25), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.25), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a, #020617);

      background-size: 200% 200%;
      animation: backgroundMove 12s ease infinite;
    }

    @keyframes backgroundMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .background-orb {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.2;
      pointer-events: none;
      z-index: -1;
    }

    .orb-one {
      background: #2563eb;
      top: -80px;
      left: -80px;
      animation: floatOrb 8s ease-in-out infinite;
    }

    .orb-two {
      background: #9333ea;
      bottom: -80px;
      right: -80px;
      animation: floatOrb 10s ease-in-out infinite reverse;
    }

    @keyframes floatOrb {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.2);
      }
    }

    .container {
      width: 100%;
      max-width: 500px;
      animation: pageAppear 0.8s ease;
    }

    @keyframes pageAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 52px;
      display: inline-block;
      animation: arcadeBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8));
    }

    @keyframes arcadeBounce {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-10px) rotate(3deg);
      }
    }

    h1 {
      margin: 10px 0 5px;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 900;

      background: linear-gradient(
        90deg,
        #60a5fa,
        #a78bfa,
        #60a5fa
      );

      background-size: 200% auto;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: titleGlow 4s linear infinite;
    }

    @keyframes titleGlow {
      to {
        background-position: 200% center;
      }
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin: 0;
    }

    .card {
      position: relative;
      overflow: hidden;

      background: var(--card);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px rgba(255, 255, 255, 0.05);

      animation: cardFloat 5s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .card::before {
      content: "";

      position: absolute;
      top: 0;
      left: -100%;

      width: 100%;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        #60a5fa,
        #a78bfa,
        transparent
      );

      animation: scanLine 4s linear infinite;
    }

    @keyframes scanLine {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }

    .login-message {
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 15px;

      font-size: 20px;
      text-align: center;

      color: white;
      background: rgba(2, 6, 23, 0.8);

      border: 1px solid #334155;
      border-radius: 14px;

      outline: none;

      transition:
        border 0.25s,
        box-shadow 0.25s,
        transform 0.25s;
    }

    input:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 4px rgba(59, 130, 246, 0.15),
        0 0 25px rgba(59, 130, 246, 0.2);

      transform: scale(1.02);
    }

    button {
      position: relative;
      overflow: hidden;

      width: 100%;

      border: none;
      border-radius: 14px;

      padding: 16px;

      color: white;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.3);

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        filter 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);

      box-shadow:
        0 14px 30px rgba(59, 130, 246, 0.45);

      filter: brightness(1.15);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button::after {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 50%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );

      transform: skewX(-20deg);

      animation: buttonShine 3s infinite;
    }

    @keyframes buttonShine {
      0% {
        left: -100%;
      }

      45%, 100% {
        left: 150%;
      }
    }

    #user-email {
      padding: 10px;

      background: rgba(15, 23, 42, 0.7);
      border-radius: 10px;

      color: #94a3b8 !important;

      animation: fadeIn 0.5s ease;
    }

    #result {
      margin-top: 28px;

      padding: 22px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(34, 197, 94, 0.12),
          rgba(16, 185, 129, 0.05)
        );

      border: 1px solid rgba(34, 197, 94, 0.25);

      animation: resultAppear 0.7s cubic-bezier(0.17, 0.67, 0.35, 1.3);
    }

    @keyframes resultAppear {
      from {
        opacity: 0;
        transform: scale(0.5) rotateX(40deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotateX(0);
      }
    }

    .payout {
      font-size: clamp(42px, 12vw, 64px);

      color: var(--green);

      font-weight: 900;

      margin: 12px 0;

      text-shadow:
        0 0 10px rgba(34, 197, 94, 0.5),
        0 0 30px rgba(34, 197, 94, 0.3);

      animation:
        payoutPop 0.8s cubic-bezier(0.17, 0.67, 0.35, 1.4),
        payoutGlow 2s ease-in-out infinite 0.8s;
    }

    @keyframes payoutPop {
      0% {
        transform: scale(0) rotate(-10deg);
      }

      70% {
        transform: scale(1.2) rotate(3deg);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes payoutGlow {
      0%, 100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.5);
      }
    }

    .coin {
      position: fixed;

      font-size: 28px;

      pointer-events: none;

      z-index: 20;

      animation: coinFloat 1.5s ease-out forwards;
    }

    @keyframes coinFloat {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0) scale(0.5);
      }

      100% {
        opacity: 0;
        transform: translateY(-180px) rotate(720deg) scale(1.4);
      }
    }

    .loading-spinner {
      display: inline-block;

      width: 20px;
      height: 20px;

      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error-log {
      color: var(--red);

      margin-top: 15px;

      font-size: 14px;
      font-weight: bold;

      min-height: 20px;

      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 32px;
      }

      button {
        font-size: 17px;
      }
    }
  </style>

</head>

<body>

  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>

  <main class="container">

```
<header class="header">

  <div class="header-icon">
    🎰
  </div>

  <h1>
    Arcade Controller
  </h1>

  <p class="subtitle">
    Spin. Win. Pay out.
  </p>

</header>

<div id="error-log"></div>

<!-- LOGIN SECTION -->

<section id="login-section" class="card">

  <p class="login-message">
    🔐 Authentication Required
  </p>

  <button id="login-btn">

  </button>

</section>

<!-- APP SECTION -->

<section id="app-section" class="card hidden">

  <p id="user-email"></p>

  <label for="paid-amount">
    Amount Paid (€)

  <input
    type="number"
    id="paid-amount"
    value="1.00"

    min="0.10"

  <button id="spin-btn">

  </button>

  <div id="result" class="hidden">

    </p>

  </div>

</section>
```

  </main>

  <script type="module">

    /* ============================
       FIREBASE IMPORTS
    ============================ */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    /* ============================
       FIREBASE CONFIGURATION
    ============================ */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBaavj-Y8151BtZWf_oBBM60Rj7zePTUXY",

      authDomain:
        "spinnywheel-arcade.firebaseapp.com",

      projectId:
        "spinnywheel-arcade",

      storageBucket:
        "spinnywheel-arcade.firebasestorage.app",

      messagingSenderId:
        "170642862625",

      appId:
        "1:170642862625:web:bc8f72daf10d3dc6d7e960",

      measurementId:
        "G-SFJ8PWVRVR"

    };


    /* ============================
       INITIALIZE FIREBASE
    ============================ */

    let app;
    let auth;
    let db;

    try {

      app =
        initializeApp(firebaseConfig);

      auth =
        getAuth(app);

      db =
        getFirestore(app);

    } catch (error) {

      showError(
        "App Init Error: " +
        error.message
      );

    }


    /* ============================
       ACCESS CONTROL
    ============================ */

    const ALLOWED_EMAIL =
      "littendekitten@gmail.com";


    /* ============================
       DOM ELEMENTS
    ============================ */

    const loginBtn =
      document.getElementById("login-btn");

    const loginSection =
      document.getElementById("login-section");

    const appSection =
      document.getElementById("app-section");

    const userEmailText =
      document.getElementById("user-email");

    const spinBtn =
      document.getElementById("spin-btn");

    const paidAmountInput =
      document.getElementById("paid-amount");

    const result =
      document.getElementById("result");

    const payoutAmount =
      document.getElementById("payout-amount");

    const errorLog =
      document.getElementById("error-log");


    /* ============================
       ERROR HANDLER
    ============================ */

    function showError(message) {

      errorLog.innerText =
        message;

      errorLog.style.animation =
        "none";

      void errorLog.offsetWidth;

      errorLog.style.animation =
        "shake 0.4s ease";

    }


    /* ============================
       FLOATING COINS
    ============================ */

    function createCoins(amount) {

      const coinCount =
        Math.min(
          Math.max(
            Math.floor(amount * 4),
            5
          ),
          20
        );


      for (
        let i = 0;
        i < coinCount;
        i++
      ) {

        const coin =
          document.createElement("div");

        coin.className =
          "coin";

        coin.innerText =
          "🪙";

        coin.style.left =
          Math.random() * 90 + 5 + "vw";

        coin.style.top =
          Math.random() * 40 + 40 + "vh";

        coin.style.animationDelay =
          Math.random() * 0.4 + "s";

        document.body.appendChild(
          coin
        );


        setTimeout(() => {

          coin.remove();

        }, 2200);

      }

    }


    /* ============================
       GOOGLE LOGIN
    ============================ */

    loginBtn.addEventListener(
      "click",
      async () => {

        loginBtn.disabled =
          true;

        loginBtn.innerHTML = `

          <span class="loading-spinner"></span>

          Logging in...

        `;

        errorLog.innerText =
          "";


        try {

          await signInWithPopup(
            auth,
            new GoogleAuthProvider()
          );

        } catch (error) {

          showError(
            "Login error: " +
            error.message
          );

          loginBtn.disabled =
            false;

          loginBtn.innerHTML =
            "🔑 Log in with Google";

        }

      }
    );


    /* ============================
       AUTH STATE
    ============================ */

    onAuthStateChanged(
      auth,
      (user) => {

        if (
          user &&
          user.email === ALLOWED_EMAIL
        ) {

          loginSection
            .classList
            .add("hidden");

          appSection
            .classList
            .remove("hidden");

          userEmailText.innerText =
            `Logged in as: ${user.email}`;

        } else {

          loginSection
            .classList
            .remove("hidden");

          appSection
            .classList
            .add("hidden");


          if (
            user &&
            user.email !== ALLOWED_EMAIL
          ) {

            alert(
              `Access Denied: ${user.email} is not authorized.`
            );

            auth.signOut();

          }

        }

      }
    );


    /* ============================
       SPIN BUTTON
    ============================ */

    spinBtn.addEventListener(
      "click",
      async () => {

        const paid =
          parseFloat(
            paidAmountInput.value
          );


        if (
          isNaN(paid) ||
          paid <= 0
        ) {

          showError(
            "Please enter a valid paid amount."
          );

          paidAmountInput.focus();

          return;

        }


        spinBtn.disabled =
          true;

        spinBtn.innerHTML = `

          <span class="loading-spinner"></span>

          SPINNING...

        `;

        errorLog.innerText =
          "";

        result.classList.add(
          "hidden"
        );


        /* Spin animation delay */

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              1800
            )
        );


        /* Random payout multiplier */

        const multiplier =
          Math.floor(
            Math.random() * 16
          ) / 10;


        const won =
          parseFloat(
            (
              paid *
              multiplier
            ).toFixed(2)
          );


        /* Display payout */

        payoutAmount.innerText =
          `€${won.toFixed(2)}`;


        result.classList.remove(
          "hidden"
        );


        /* Celebration for wins */

        if (
          won > paid
        ) {

          createCoins(
            won
          );

        }


        /* Save spin in Firestore */

        try {

          await addDoc(

            collection(
              db,
              "spins"
            ),

            {

              pricePaid:
                paid,

              priceWon:
                won,

              profit:
                parseFloat(
                  (
                    paid -
                    won
                  ).toFixed(2)
                ),

              multiplier:
                multiplier,

              timestamp:
                serverTimestamp()

            }

          );

        } catch (error) {

          showError(
            "Database error: " +
            error.message
          );

        }


        /* Reset button */

        spinBtn.disabled =
          false;

        spinBtn.innerHTML =
          "🎡 SPIN AGAIN";

      }
    );


    /* ============================
       ENTER KEY SUPPORT
    ============================ */

    paidAmountInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter"
        ) {

          spinBtn.click();

        }

      }
    );

  </script>

</body>
