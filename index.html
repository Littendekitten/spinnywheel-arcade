<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBaavj-Y8151BtZWf_oBBM60Rj7zePTUXY",
    authDomain: "spinnywheel-arcade.firebaseapp.com",
    projectId: "spinnywheel-arcade",
    storageBucket: "spinnywheel-arcade.firebasestorage.app",
    messagingSenderId: "170642862625",
    appId: "1:170642862625:web:bc8f72daf10d3dc6d7e960",
    measurementId: "G-SFJ8PWVRVR"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const ALLOWED_EMAIL = "littendekitten@gmail.com";

  const loginBtn = document.getElementById('login-btn');
  const loginSection = document.getElementById('login-section');
  const appSection = document.getElementById('app-section');
  const userEmailText = document.getElementById('user-email');
  const spinBtn = document.getElementById('spin-btn');

  loginBtn.addEventListener('click', () => {
    signInWithPopup(auth, new GoogleAuthProvider());
  });

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ALLOWED_EMAIL) {
      loginSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      userEmailText.innerText = `Logged in as: ${user.email}`;
    } else {
      loginSection.classList.remove('hidden');
      appSection.classList.add('hidden');
      if (user && user.email !== ALLOWED_EMAIL) {
        alert(`Access Denied: ${user.email} is not authorized.`);
        auth.signOut();
      }
    }
  });

  spinBtn.addEventListener('click', async () => {
    const paid = parseFloat(document.getElementById('paid-amount').value);
    if (isNaN(paid) || paid <= 0) return alert('Enter a valid paid amount');

    spinBtn.disabled = true;

    // Multiplier options: 0.0x to 1.5x
    const multiplier = Math.floor(Math.random() * 16) / 10;
    const won = parseFloat((paid * multiplier).toFixed(2));

    document.getElementById('payout-amount').innerText = `€${won.toFixed(2)}`;
    document.getElementById('result').classList.remove('hidden');

    try {
      await addDoc(collection(db, "spins"), {
        pricePaid: paid,
        priceWon: won,
        profit: parseFloat((paid - won).toFixed(2)),
        timestamp: serverTimestamp()
      });
    } catch (err) {
      alert("Failed to save spin: " + err.message);
    } finally {
      spinBtn.disabled = false;
    }
  });
</script>
